<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="canonical"
      href="https://workmeraterp.com.ng/create-profile.html"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Profile - WorkMerate</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <meta
      name="description"
      content="Create your WorkMerate profile to get started with tax automation, compliance, and integrations."
    />
    <!-- Open Graph / Twitter Card -->
    <meta property="og:site_name" content="WorkMerate" />
    <meta property="og:title" content="Create Profile - WorkMerate" />
    <meta
      property="og:description"
      content="Create your WorkMerate profile to get started with tax automation, compliance, and integrations."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://workmeraterp.com.ng/create-profile.html"
    />
    <meta
      property="og:image"
      content="https://workmeraterp.com.ng/assets/favicon.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@WorkMerate" />
    <meta name="twitter:creator" content="@WorkMerate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth.css" />
    <script src="lazy-loader.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-visual auth-visual--signup" aria-hidden="true">
        <a href="index.html" class="back-link">
          <span class="back-link__arrow" aria-hidden="true">&larr;</span>
          <span>Back to Website</span>
        </a>
      </section>

      <section class="auth-panel">
        <div class="auth-card auth-card--wide">
          <img src="./assets/Logo.png" alt="WorkMerate" class="brand-mark" />
          <h1 class="auth-title">Create your profile</h1>
          <p class="auth-subtitle">
            Please enter your business or company details in the fields below.
          </p>

          <form class="auth-form" action="secure-account.html">
            <input class="text-input" type="text" placeholder="Name" />
            <input class="text-input" type="tel" placeholder="Phone Number" />
            <input class="text-input" type="text" placeholder="Address" />

            <div class="actions-between">
              <a href="check-email.html" class="button button--secondary"
                >Back</a
              >
              <button class="button button--primary" type="submit">
                Proceed
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
